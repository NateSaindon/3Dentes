name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The .glb is not committed — it is rebuilt from the vendored STLs, which
      # also re-runs the laterality assertion on every deploy.
      #
      # TOOTH_SOURCE=cbct publishes the build made from the operator's own CBCT
      # (hard tissue, pulp, PDL, gingiva and nerves) rather than the BodyParts3D
      # alpha. Without it the deploy silently shipped the older model while every
      # local review ran against the CBCT one. The operator has explicitly
      # consented to publishing their own anatomy; see CLAUDE.md.
      - run: npm run build:assets
        env:
          TOOTH_SOURCE: cbct

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
